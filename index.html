<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMarket - Lista de Supermercado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- TELA DE LOGIN -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
            <h1 class="text-2xl font-bold text-center text-slate-900 mb-2">SmartMarket</h1>
            <p class="text-sm text-slate-500 text-center mb-6">Faça login para acessar suas listas de compras</p>
            
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">E-mail</label>
                    <input type="email5" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Senha</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div id="auth-error" class="text-red-500 text-xs hidden"></div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" onclick="handleAuth('login')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Entrar</button>
                    <button type="button" onclick="handleAuth('signup')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg transition">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- APLICATIVO PRINCIPAL -->
    <div id="app-screen" class="hidden flex-1 flex flex-col">
        <header class="bg-indigo-600 text-white shadow">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="font-bold text-lg">SmartMarket</h1>
                <button onclick="logout()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded transition">Sair</button>
            </div>
            <!-- Abas de Navegação -->
            <div class="max-w-4xl mx-auto px-4 flex gap-4 border-t border-indigo-500">
                <button onclick="switchTab('planning')" id="tab-planning" class="py-3 font-medium border-b-2 border-white">Planejamento</button>
                <button onclick="switchTab('shopping')" id="tab-shopping" class="py-3 font-medium border-b-2 border-transparent text-indigo-200">No Supermercado</button>
            </div>
        </header>

        <main class="max-w-4xl mx-auto w-full p-4 flex-1">
            
            <!-- SEÇÃO 1: PLANEJAMENTO -->
            <section id="section-planning" class="space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <h2 class="font-bold text-slate-700 mb-3">Adicionar à Lista de Planejamento</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input type="text" id="plan-ean" placeholder="Código EAN ou Nome" class="px-3 py-2 border rounded-lg text-sm outline-none">
                        <input type="text" id="plan-name" placeholder="Nome do Produto" class="px-3 py-2 border rounded-lg text-sm outline-none">
                        <button onclick="addItemPlanning()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded-lg transition">Adicionar Item</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                        <h3 class="font-bold text-slate-700">Sua Lista de Planejamento</h3>
                        <span id="total-estimado" class="text-sm font-semibold text-indigo-600">Total Estimado: R$ 0,00</span>
                    </div>
                    <div id="planning-list" class="divide-y divide-slate-100"></div>
                </div>
            </section>

            <!-- SEÇÃO 2: NO SUPERMERCADO -->
            <section id="section-shopping" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-center">
                    <button onclick="startScanner()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2.5 rounded-lg shadow transition">Escanear Código de Barras</button>
                    <div id="scanner-container" class="mt-4 max-w-sm mx-auto hidden"></div>
                </div>

                <!-- Formulário Manual caso necessário -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 mb-2">Registrar Compra do Item</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                        <input type="text" id="shop-ean" placeholder="EAN" class="px-3 py-2 border rounded-lg text-sm outline-none">
                        <input type="text" id="shop-name" placeholder="Nome do Produto" class="px-3 py-2 border rounded-lg text-sm outline-none">
                        <input type="number" step="0.01" id="shop-price" placeholder="Preço Pago (R$)" class="px-3 py-2 border rounded-lg text-sm outline-none">
                        <button onclick="registerPurchase()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 rounded-lg transition">Confirmar Compra</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 border-b bg-slate-50">
                        <h3 class="font-bold text-slate-700">Itens Comprados Nesta Ida</h3>
                    </div>
                    <div id="shopping-list" class="divide-y divide-slate-100"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- SCRIPT DE INTEGRAÇÃO -->
    <script>
        // CONFIGURAÇÃO DO SUPABASE (Substitua pelas suas chaves)
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let html5QrCode = null;

        // Inicialização de Autenticação
        supabaseClient.auth.onAuthStateChange((event, session) => {
            currentUser = session?.user || null;
            if (currentUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadPlanningList();
                loadShoppingList();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        async function handleAuth(type) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');

            let response;
            if (type === 'login') {
                response = await supabaseClient.auth.signInWithPassword({ email, password });
            } else {
                response = await supabaseClient.auth.signUp({ email, password });
                if (!response.error) alert('Cadastro realizado! Verifique seu e-mail se necessário ou faça login.');
            }

            if (response.error) {
                errorEl.textContent = response.error.message;
                errorEl.classList.remove('hidden');
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
        }

        // Navegação de Abas
        function switchTab(tab) {
            const isPlanning = tab === 'planning';
            document.getElementById('section-planning').classList.toggle('hidden', !isPlanning);
            document.getElementById('section-shopping').classList.toggle('hidden', isPlanning);
            
            document.getElementById('tab-planning').className = isPlanning ? 'py-3 font-medium border-b-2 border-white' : 'py-3 font-medium border-b-2 border-transparent text-indigo-200';
            document.getElementById('tab-shopping').className = !isPlanning ? 'py-3 font-medium border-b-2 border-white' : 'py-3 font-medium border-b-2 border-transparent text-indigo-200';
            
            if (!isPlanning && html5QrCode) {
                stopScanner();
            }
        }

        // --- MÓDULO DE PLANEJAMENTO ---
        async function addItemPlanning() {
            const ean = document.getElementById('plan-ean').value.trim();
            const nome = document.getElementById('plan-name').value.trim();
            if (!ean || !nome) return alert('Preencha o EAN e o Nome.');

            const { error } = await supabaseClient.from('lista_planejamento').insert([{
                user_id: currentUser.id,
                ean,
                nome,
                quantidade: 1
            }]);

            if (error) alert(error.message);
            else {
                document.getElementById('plan-ean').value = '';
                document.getElementById('plan-name').value = '';
                loadPlanningList();
            }
        }

        async function loadPlanningList() {
            const { data, error } = await supabaseClient.from('lista_planejamento').select('*').order('criado_em', { ascending: false });
            const listEl = document.getElementById('planning-list');
            if (error) return;

            if (data.length === 0) {
                listEl.innerHTML = '<p class="p-4 text-sm text-slate-400 text-center">Nenhum item no planejamento.</p>';
                document.getElementById('total-estimado').textContent = 'Total Estimado: R$ 0,00';
                return;
            }

            let html = '';
            let totalEstimado = 0;

            for (let item of data) {
                // Buscar preço médio histórico do produto
                const { data: prodData } = await supabaseClient.from('produtos').select('preco_medio').eq('user_id', currentUser.id).eq('ean', item.ean).single();
                const precoSugerido = prodData ? prodData.preco_medio : 0;
                totalEstimado += precoSugerido * item.quantidade;

                html += `
                    <div class="p-4 flex justify-between items-center text-sm">
                        <div>
                            <p class="font-semibold text-slate-800">${item.nome}</p>
                            <p class="text-xs text-slate-500">EAN: ${item.ean} | Sugestão: R$ ${precoSugerido.toFixed(2)}</p>
                        </div>
                        <button onclick="deletePlanning('${item.id}')" class="text-red-500 hover:text-red-700 text-xs font-medium">Remover</button>
                    </div>
                `;
            }
            listEl.innerHTML = html;
            document.getElementById('total-estimado').textContent = `Total Estimado: R$ ${totalEstimado.toFixed(2)}`;
        }

        async function deletePlanning(id) {
            await supabaseClient.from('lista_planejamento').delete().eq('id', id);
            loadPlanningList();
        }

        // --- MÓDULO DE SUPERMERCADO & HISTÓRICO ---
        async function registerPurchase() {
            const ean = document.getElementById('shop-ean').value.trim();
            const nome = document.getElementById('shop-name').value.trim();
            const precoPago = parseFloat(document.getElementById('shop-price').value);

            if (!ean || !nome || isNaN(precoPago)) return alert('Preencha todos os campos corretamente.');

            // 1. Salvar no histórico de compras
            const { error: errCompra } = await supabaseClient.from('lista_compras').insert([{
                user_id: currentUser.id,
                ean,
                nome,
                preco_pago: precoPago
            }]);

            if (errCompra) return alert(errCompra.message);

            // 2. Atualizar ou criar na tabela de produtos e preço médio
            const { data: prodExistente } = await supabaseClient.from('produtos').select('*').eq('user_id', currentUser.id).eq('ean', ean).single();

            if (prodExistente) {
                // Simples cálculo de média ponderada/recente
                const novoPrecoMedio = (prodExistente.preco_medio + precoPago) / 2;
                await supabaseClient.from('produtos').update({ preco_medio: novoPrecoMedio, ultima_atualizacao: new Date() }).eq('id', prodExistente.id);
            } else {
                await supabaseClient.from('produtos').insert([{
                    user_id: currentUser.id,
                    ean,
                    nome,
                    preco_medio: precoPago
                }]);
            }

            document.getElementById('shop-ean').value = '';
            document.getElementById('shop-name').value = '';
            document.getElementById('shop-price').value = '';
            loadShoppingList();
        }

        async function loadShoppingList() {
            const { data, error } = await supabaseClient.from('lista_compras').select('*').order('data_compra', { ascending: false });
            const listEl = document.getElementById('shopping-list');
            if (error || data.length === 0) {
                listEl.innerHTML = '<p class="p-4 text-sm text-slate-400 text-center">Nenhum item comprado nesta sessão.</p>';
                return;
            }

            listEl.innerHTML = data.map(item => `
                <div class="p-4 flex justify-between items-center text-sm">
                    <div>
                        <p class="font-semibold text-slate-800">${item.nome}</p>
                        <p class="text-xs text-slate-500">EAN: ${item.ean}</p>
                    </div>
                    <span class="font-bold text-emerald-600">R$ ${item.preco_pago.toFixed(2)}</span>
                </div>
            `).join('');
        }

        // Leitor de Código de Barras (Câmera)
        function startScanner() {
            const container = document.getElementById('scanner-container');
            container.classList.remove('hidden');
            
            html5QrCode = new Html5Qrcode("scanner-container");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                async (decodedText) => {
                    document.getElementById('shop-ean').value = decodedText;
                    
                    // Tentar buscar se já existe o nome cadastrado no histórico do usuário
                    const { data } = await supabaseClient.from('produtos').select('nome').eq('user_id', currentUser.id).eq('ean', decodedText).single();
                    if (data) {
                        document.getElementById('shop-name').value = data.nome;
                    }

                    stopScanner();
                },
                (errorMessage) => { /* Erros de leitura ignorados por frame */ }
            ).catch(err => {
                alert('Erro ao iniciar a câmera: ' + err);
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                }).catch(err => console.log(err));
            }
        }
    </script>
</body>
</html>
